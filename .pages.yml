media:
  input: ""
  output: ""

content:
  - name: homepage
    label: "Homepage Content"
    type: file
    path: index.html
    format: html
    fields:
      - name: hero_headline
        label: "Hero Headline"
        type: string
        selector: "div.hero h1"

      - name: hero_description
        label: "Hero Description"
        type: text
        selector: "div.hero p"

      - name: philosophy_quote
        label: "Philosophy Quote"
        type: text
        selector: "blockquote.philosophy-quote"

      - name: about_text
        label: "About Paragraph"
        type: text
        selector: "div.about-content p"

media:
  input: public/images
  output: /images

content:
  - name: homepage
    label: Homepage Content
    type: file
    path: content/site.json
    fields:
      - label: Logo Image URL
        name: logo_url
        type: string
      - label: Headshot Image URL
        name: headshot_url
        type: string
      - label: Hero Title
        name: hero_title
        type: string
      - label: Hero Body
        name: hero_body
        type: text
      - label: Philosophy Quote
        name: philosophy_quote
        type: text
      - label: Services
        name: services
        type: object
        list: true
        fields:
          - label: Service Title
            name: title
            type: string
          - label: Service Description
            name: description
            type: text
      - label: About Text
        name: about_text
        type: text
      - label: FAQs
        name: faqs
        type: object
        list: true
        fields:
          - label: Question
            name: question
            type: string
          - label: Answer
            name: answer
            type: text
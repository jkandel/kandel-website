<style>
  :root {
    --bg: #0F172A;
    --card-bg: #1E293B;
    --border: #334155;
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --accent: #38BDF8;
    --accent-hover: #7DD3FC;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .hero-section {
    background-color: #0F172A; 
    background-image: url('/public/images/pacific_cinematic_coastline.jpg'); 
    background-size: cover;
    background-position: center 30%;
    background-repeat: no-repeat;
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: 'Newsreader', serif;
    margin: 0;
    padding: 0;
  }

  .hero-nav {
    background: rgba(15, 23, 42, 0.4);
    padding: 1.5rem 4rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 1.25rem;
  }

  .hero-logo {
    height: 60px;
    width: auto;
    object-fit: contain;
    border-radius: 12px;
    display: block;
  }

  .company-name {
    color: #F8F6F0;
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .nav-links {
    display: flex;
    gap: 3.5rem;
    align-items: center;
  }

  .nav-links a {
    color: #38BDF9;
    text-decoration: none;
    font-size: 1.15rem;
    font-weight: 400;
    transition: opacity 0.2s ease;
  }

  .nav-links a:hover {
    opacity: 0.8;
  }

  .hero-panel {
    background-color: #0F172A;
    width: 100%;
    padding: 3.5rem 4rem;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4rem;
    margin-top: auto; 
  }

  .hero-text-group {
    flex: 1;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .hero-headline {
    color: #F8F6F0;
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 500;
    line-height: 1.2;
    margin: 0;
  }

  .hero-body {
    color: #F8F6F0;
    font-size: clamp(1.1rem, 2vw, 1.35rem);
    line-height: 1.6;
    margin: 0;
    opacity: 0.9;
    max-width: 800px;
  }

  .hero-cta-wrapper {
    flex-shrink: 0;
  }

  .cta-button {
    background-color: #38BDF9;
    color: #0F172A;
    font-family: 'Newsreader', serif;
    font-size: 1.25rem;
    font-weight: 600;
    text-decoration: none;
    padding: 1rem 2.5rem;
    border-radius: 4px;
    display: inline-block;
    transition: background-color 0.2s ease, transform 0.2s ease;
  }

  .cta-button:hover {
    background-color: #7DD3FC;
    transform: translateY(-2px);
  }

  .container {
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 1.5rem 6rem;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    padding: 0.85rem 1.75rem;
    border-radius: 6px;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
    border: none;
    cursor: pointer;
  }

  .btn-primary {
    background-color: var(--accent);
    color: #0F172A;
  }

  .btn-primary:hover {
    background-color: var(--accent-hover);
    transform: translateY(-1px);
  }

  section {
    padding: 4.5rem 0;
    border-bottom: 1px solid var(--border);
  }

  .section-label {
    text-transform: uppercase;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-bottom: 1rem;
  }

  .section-title {
    font-family: 'Newsreader', serif;
    font-size: 2.25rem;
    font-weight: 600;
    margin-bottom: 2.5rem;
    letter-spacing: -0.01em;
  }

  .philosophy-quote {
    font-family: 'Newsreader', serif;
    font-size: 1.35rem;
    font-style: italic;
    line-height: 1.85;
    color: var(--text-main);
    max-width: 880px;
    border-left: 3px solid var(--accent);
    padding-left: 2rem;
    margin-top: 1.25rem;
  }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5rem;
  }

  .service-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2rem;
    transition: border-color 0.2s ease;
    display: flex;
    flex-direction: column;
  }

  .service-card:hover {
    border-color: var(--accent);
  }

  .service-card h3 {
    font-size: 1.2rem;
    font-weight: 600;
    line-height: 1.35;
    color: var(--text-main);
  }

  .service-desc {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin-top: 0.85rem;
    line-height: 1.6;
  }

  .about-content {
    font-size: 1.25rem;
    color: var(--text-muted);
    max-width: 800px;
    line-height: 1.8;
  }

  .contact-form {
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .form-group label {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text-main);
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 0.75rem 1rem;
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-main);
    font-family: inherit;
    font-size: 1rem;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .form-group textarea {
    min-height: 120px;
    resize: vertical;
  }

  footer {
    padding: 4rem 1.5rem 3rem;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .profile-photo {
    float: left;
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 14px;
    margin: 0.25rem 2rem 1.25rem 0;
    border: 1px solid var(--border);
  }

  @media (max-width: 1024px) {
    .hero-panel {
      flex-direction: column;
      align-items: flex-start;
      gap: 2.5rem;
      padding: 3rem 2rem;
    }
    .hero-nav {
      flex-direction: column;
      gap: 1.5rem;
      padding: 1.5rem 2rem;
    }
    .nav-links {
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  }

  @media (max-width: 600px) {
    .profile-photo-container {
      float: none !important;
      margin: 0 0 1rem 0 !important;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-photo {
      float: none !important;
      margin: 0 0 0.5rem 0 !important;
      width: 150px;
      height: 150px;
    }
  }
</style>

layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://kandelstrategies.com/#website",
        "url": "https://kandelstrategies.com",
        "name": "Kandel Strategies"
      },
      {
        "@type": ["Organization", "ProfessionalService"],
        "@id": "https://kandelstrategies.com/#organization",
        "name": "Kandel Strategies",
        "url": "https://kandelstrategies.com"
      }
    ]
  }
  </script>
</head>
  <body>

  <!-- Full Bleed Hero Section -->
  <section class="hero-section" id="hero-section" style="background-image: none;">
  {% include nav.html %}
    
<div class="hero-panel">    
    <!-- Left Column: Headline -->
    <div style="flex: 1;">
        <h1 class="hero-headline" id="hero-title" style="margin: 0;"></h1>
    </div>
    
    <!-- Right Column: Copy and Button Stacked -->
    <div style="flex: 1.5; display: flex; flex-direction: column; gap: 1.5rem; align-items: flex-start;">
        <p class="hero-body" id="hero-body" style="margin: 0; line-height: 1.6;"></p>
        <a href="#contact" class="cta-button" style="white-space: nowrap;">Let's Talk</a>
    </div>

</div>
  </section>

  <main class="container" id="main-content">
    <section id="section-philosophy">
      <h2 class="section-label" id="philosophy-header"></h2>
      <blockquote class="philosophy-quote philosophy-text" id="philosophy-quote"></blockquote>
    </section>

    <section id="section-services">
      <h2 class="section-title" id="services-header"></h2>
      <div class="services-grid" id="services-grid"></div>
    </section>
    <section id="how-it-works" style="padding: 2rem 0; display: none;">
      <h2 class="section-title" id="hiw-header"></h2>
      <div id="hiw-grid" style="display: flex; gap: 2rem; flex-wrap: wrap;"></div>
    </section>
    
    <section id="section-about">
      <h2 class="section-title" id="about-header"></h2>
      <div class="about-content">
        <div class="profile-photo-container" style="float: left; margin: 0.25rem 2rem 1.25rem 0; text-align: center;">
          <img id="headshot-img" src="" alt="Jason Kandel" class="profile-photo" style="float: none; margin: 0 0 0.5rem 0; display: none;">
          <div>
            <a href="https://www.linkedin.com/in/jasonkandel/" target="_blank" rel="noopener" style="color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: 500; display: inline-flex; align-items: center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 5px;">
                <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
              </svg>
              Connect on LinkedIn
            </a>
          </div>
        </div>
        <p class="about-p" id="about-text"></p>
      </div>
    </section>

    <section id="contact">
      <h2 class="section-title">Get in Touch</h2>
      <form action="https://api.web3forms.com/submit" method="POST" class="contact-form">
        <input type="hidden" name="access_key" value="a70bba3a-4a4f-490e-9c14-601b9bd19280" />
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <div>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </div>
      </form>
    </section>

    <section id="faq" style="padding: 2rem 0;">
      <h2>Frequently Asked Questions</h2>
      <div id="faq-list"></div>
    </section>
  </main>

  {% include footer.html %}

  <script>
    fetch('content/site.json?v=' + new Date().getTime())
      .then(r => r.json())
      .then(data => {
        if (data.logo_url) {
          document.getElementById('site-logo').src = '/public/images/' + data.logo_url.split('/').pop();
        }
        const headshot = document.getElementById('headshot-img');
        if (data.headshot_url) {
          headshot.src = '/public/images/' + data.headshot_url.split('/').pop();
          headshot.style.display = 'block';
        } else {
          headshot.style.display = 'none';
        }
        const heroSection = document.getElementById('hero-section');
        if (data.lead_image_url) {
          heroSection.style.backgroundImage = `url('/public/images/${data.lead_image_url.split('/').pop()}')`;
        }
        const heroTitle = document.getElementById('hero-title');
        if (data.hero_title) heroTitle.textContent = data.hero_title;
        else heroTitle.style.display = 'none';
        const heroBody = document.getElementById('hero-body');
        if (data.hero_body) heroBody.textContent = data.hero_body;
        else heroBody.style.display = 'none';
        const philHeader = document.getElementById('philosophy-header');
        if (data.philosophy_header) philHeader.textContent = data.philosophy_header;
        else philHeader.style.display = 'none';
        const philQuote = document.getElementById('philosophy-quote');
        if (data.philosophy_quote) philQuote.textContent = data.philosophy_quote;
        else philQuote.style.display = 'none';
        const servHeader = document.getElementById('services-header');
        if (data.services_header) servHeader.textContent = data.services_header;
        else servHeader.style.display = 'none';
        const grid = document.getElementById('services-grid');
        if (data.services && data.services.length) {
          grid.innerHTML = data.services.map(s => `
            <div class="service-card">
              <h3>${s.title}</h3>
              <p class="service-desc">${s.description}</p>
            </div>`).join('');
        } else {
          grid.innerHTML = '';
        }
        const hiwSection = document.getElementById('how-it-works');
        if (data.how_it_works_steps && data.how_it_works_steps.length) {
          hiwSection.style.display = 'block';
          if (data.how_it_works_header) document.getElementById('hiw-header').textContent = data.how_it_works_header;
          document.getElementById('hiw-grid').innerHTML = data.how_it_works_steps.map(s => `
            <div style="flex: 1; min-width: 250px; background: rgba(255, 255, 255, 0.05); padding: 2rem; border-radius: 1rem;">
              <h3 style="color: #38BDF8; margin-top: 0;">${s.title}</h3>
              <p style="font-size: 0.95rem; margin-bottom: 0; line-height: 1.6;">${s.description}</p>
            </div>`).join('');
        }
        const abtHeader = document.getElementById('about-header');
        if (data.about_header) abtHeader.textContent = data.about_header;
        else abtHeader.style.display = 'none';
        const abtText = document.getElementById('about-text');
        if (data.about_text) abtText.textContent = data.about_text;
        else abtText.style.display = 'none';
        const faqList = document.getElementById('faq-list');
        const faqEntities = [];
        if (data.faqs && data.faqs.length) {
          faqList.innerHTML = data.faqs.map(f => `
            <div style="margin-bottom: 1.5rem;">
              <h3>${f.question}</h3>
              <p>${f.answer}</p>
            </div>`).join('');
          data.faqs.forEach(f => {
            faqEntities.push({
              "@type": "Question",
              "name": f.question,
              "acceptedAnswer": {
                "@type": "Answer",
                "text": f.answer
              }
            });
          });
        } else {
          faqList.innerHTML = '';
        }
        const schemaGraph = {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "WebSite",
              "@id": "https://kandelstrategies.com/#website",
              "url": "https://kandelstrategies.com",
              "name": "Kandel Strategies"
            },
            {
              "@type": ["Organization", "ProfessionalService"],
              "@id": "https://kandelstrategies.com/#organization",
              "name": "Kandel Strategies",
              "url": "https://kandelstrategies.com"
            }
          ]
        };
        if (faqEntities.length > 0) {
          schemaGraph["@graph"].push({
            "@type": "FAQPage",
            "mainEntity": faqEntities
          });
        }
        const script = document.createElement('script');
        script.type = 'application/ld+json';
        script.text = JSON.stringify(schemaGraph);
        document.head.appendChild(script);
      })
      .catch(err => console.error('Content load failed:', err));
  </script>
</body>
</html>

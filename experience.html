<body>

  <!-- Slim Dark Header -->
  <section class="hero-section" style="background-image: none; min-height: auto;">
    {% include nav.html %}
  </section>

  <main class="container" id="main-content" style="padding-top: 4rem; padding-bottom: 4rem;">
    <article style="max-width: 800px; margin: 0 auto;">
      <h1 style="font-size: 2.5rem; margin-bottom: 2rem;">Professional Background</h1>
      
      <!-- Summary Card Box -->
      <div style="background-color: #ffffff; border: 1.5px solid #1d4ed8; border-radius: 12px; padding: 2rem; margin-bottom: 3rem;">
        <p id="page-summary" style="font-size: 1.15rem; line-height: 1.6; margin: 0; color: #1e293b;"></p>
      </div>
      
      <div id="experience-container"></div>
    </article>
  </main>

  {% include footer.html %}

<script>
  // Load dynamic experience entries from JSON
  fetch('/content/experience.json?v=' + new Date().getTime())
    .then(r => r.json())
    .then(data => {
      if (data.summary) {
        document.getElementById('page-summary').textContent = data.summary;
      }

      const container = document.getElementById('experience-container');
      const items = Array.isArray(data) ? data : (data.list || data.experience_items || data.items || [data]);
      
      if (items && items.length) {
        container.innerHTML = items.map(item => {
          const role = item.role || item['Role Title'] || item['role_title'] || '';
          const company = item.company || item['Company'] || '';
          const dates = item.dates || item['Dates'] || '';
          const description = item.description || item['Description'] || '';

          return `
            <div style="margin-bottom: 2rem;">
              <strong>${role}${company ? ' — ' + company : ''}</strong><br>
              <span style="color: #aaa; font-size: 0.9rem;">${dates}</span>
              <p style="margin-top: 0.5rem; line-height: 1.6; white-space: pre-line;">${description}</p>
            </div>
          `;
        }).join('');
      }
    })
    .catch(err => console.error('Experience content load failed:', err));
</script>
</body>
</html>

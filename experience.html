---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://kandelstrategies.com/#website",
        "url": "https://kandelstrategies.com",
        "name": "Kandel Strategies"
      },
      {
        "@type": ["Organization", "ProfessionalService"],
        "@id": "https://kandelstrategies.com/#organization",
        "name": "Kandel Strategies",
        "url": "https://kandelstrategies.com"
      }
    ]
  }
  </script>
</head>
<body>

  <!-- Slim Dark Header -->
  <section class="hero-section" style="background-image: none; min-height: auto;">
    {% include nav.html %}
  </section>

  <main class="container" id="main-content" style="padding-top: 4rem; padding-bottom: 4rem;">
    <article style="max-width: 800px; margin: 0 auto;">
      <h1 style="font-size: 2.5rem; margin-bottom: 2.5rem;">Professional Background</h1>
      
      <div id="experience-container"></div>
    </article>
  </main>

  {% include footer.html %}

  <script>
    // Load dynamic site logo
    fetch('/content/site.json?v=' + new Date().getTime())
      .then(r => r.json())
      .then(data => {
        if (data.logo_url) {
          const logo = document.getElementById('site-logo');
          if (logo) logo.src = '/public/images/' + data.logo_url.split('/').pop();
        }
      })
      .catch(err => console.error('Logo load failed:', err));

    // Load dynamic experience entries from JSON
    fetch('/content/experience.json?v=' + new Date().getTime())
      .then(r => r.json())
      .then(items => {
        const container = document.getElementById('experience-container');
        if (items && items.length) {
          container.innerHTML = items.map(item => `
            <div style="margin-bottom: 2rem;">
              <strong>${item.role} — ${item.company}</strong><br>
              <span style="color: #aaa; font-size: 0.9rem;">${item.dates}</span>
              <p style="margin-top: 0.5rem; line-height: 1.6;">${item.description}</p>
            </div>
          `).join('');
        }
      })
      .catch(err => console.error('Experience content load failed:', err));
  </script>
</body>
</html>

---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  
  <!-- Slim Dark Header -->
  <section class="hero-section" style="background-image: none; min-height: auto;">
    {% include nav.html %}
  </section>

  <!-- Individual Article Content -->
  <main class="container" style="padding-top: 4rem; padding-bottom: 4rem;">
    <article style="max-width: 800px; margin: 0 auto; padding: 3rem; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #eaeaea; background-color: #fff;">
      
      <!-- Featured Image -->
      {% if page.image %}
        {% assign image_filename = page.image | split: '/' | last %}
        <img src="/public/images/{{ image_filename }}" alt="{{ page.title }}" style="width: 100%; max-height: 400px; object-fit: cover; border-radius: 0.5rem; margin-bottom: 2rem;">
      {% endif %}

      <h1 style="margin-top: 0; margin-bottom: 0.5rem; font-size: 2.5rem;">{{ page.title }}</h1>
      <p style="color: #666; font-size: 0.9rem; margin-bottom: 2rem; border-bottom: 1px solid #eaeaea; padding-bottom: 1rem;">
        {{ page.date | date: "%B %d, %Y" }}
      </p>
      
      <!-- Article Body -->
      <div style="line-height: 1.8; font-size: 1.1rem; color: #333;">
        {{ content }}
      </div>
      
      <div style="margin-top: 3rem; border-top: 1px solid #eaeaea; padding-top: 1.5rem;">
        <a href="/insights" style="color: #38bdf8; font-weight: bold; text-decoration: none;">&larr; Back to all Insights</a>
      </div>
    </article>
  </main>

  {% include footer.html %}

  <!-- Load your dynamic logo -->
  <script>
    fetch('/content/site.json?v=' + new Date().getTime())
      .then(r => r.json())
      .then(data => {
        if (data.logo_url) {
          const logo = document.getElementById('site-logo');
          if(logo) logo.src = '/public/images/' + data.logo_url.split('/').pop();
        }
      })
      .catch(err => console.error('Logo load failed:', err));
  </script>
</body>
</html>
